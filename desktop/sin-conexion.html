<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sin conexión — Costea POS Caja</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b1a19;
        color: #f5f1ec;
        font-family: system-ui, "Segoe UI", sans-serif;
        text-align: center;
      }
      .caja { max-width: 520px; padding: 32px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #bdb4ab; line-height: 1.5; }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #e85d3a;
        cursor: pointer;
      }
      img { width: 84px; height: 84px; }
    </style>
  </head>
  <body>
    <div class="caja">
      <img src="build/icon.png" alt="Costea POS" />
      <h1>No se pudo abrir el punto de venta</h1>
      <p>
        La caja necesita conexión con el servidor central para mostrar el punto de venta.
        Las facturas ya emitidas y pendientes siguen guardadas en esta computadora y se
        enviarán automáticamente cuando vuelva el internet.
      </p>
      <button id="reintentar">Reintentar</button>
    </div>
    <script>
      document.getElementById("reintentar").onclick = () => window.costeaCaja.abrirPos();
    </script>
  </body>
</html>
