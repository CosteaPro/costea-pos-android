name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: List mobile folder
        run: ls -la mobile/

      - name: Build Android APK
        working-directory: ./mobile
        run: |
          chmod +x ./build-apk.sh
          ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: costea-pos-android
          path: |
            mobile/*.apk
            platforms/android/app/build/outputs/apk/release/*.apk
